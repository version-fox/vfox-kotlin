name: Test Plugin

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # vfox 1.0.13 introduced `vfox plugin test`, which finds every
      # tests/**/*_test.lua and runs each in a VM of its own. The archive is
      # pinned and its checksum checked, like the actions in the other
      # workflows. Change the two together to move to another release.
      - name: Install vfox
        env:
          VFOX_VERSION: 1.0.13
          VFOX_SHA256: 7ad0a4c82c8173f09393e09abecc3e27468253bab5fe53ffbf58f2b12b3fc768
        run: |
          archive="$RUNNER_TEMP/vfox.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/version-fox/vfox/releases/download/v${VFOX_VERSION}/vfox_${VFOX_VERSION}_linux_x86_64.tar.gz"
          echo "$VFOX_SHA256  $archive" | sha256sum --check
          mkdir "$RUNNER_TEMP/vfox"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/vfox" --strip-components=1 \
            "vfox_${VFOX_VERSION}_linux_x86_64/vfox"
          echo "$RUNNER_TEMP/vfox" >> "$GITHUB_PATH"
      - name: Run the offline hook tests with vfox
        run: vfox plugin test .
