name: E2E

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a pull request replaces the run of the push before it. Every
  # commit on main gets a group of its own, so re-running an older commit does
  # not cancel a newer one.
  group: e2e-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-linux:
    name: Linux (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      # The suite terminates every container explicitly via t.Cleanup, so it
      # does not need Ryuk (which also keeps the local and CI paths identical).
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Run the Linux E2E suite
        run: go test -v -timeout 45m -run TestE2E ./linux
        working-directory: tests/e2e

  e2e-windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Check Windows-container support
        shell: pwsh
        run: |
          docker version
          $info = (docker info --format '{{.OSType}}' 2>$null | Out-String).Trim()
          if ($info -ne 'windows') {
            Write-Host " Docker daemon is in $info-container mode; switching to Windows containers."
            & "$env:ProgramFiles\Docker\Docker\DockerCli.exe" -SwitchWindowsEngine
            docker info --format '{{.OSType}}'
          }
      - name: Run the Windows E2E suite
        shell: pwsh
        run: go test -v -timeout 55m -run TestE2E ./windows
        working-directory: tests/e2e
